
name: Selenium CI CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Selenium Tests
      working-directory: "./Maven_selenium_new_project"
      run: mvn test
      continue-on-error: true

    - name: Upload Extent Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Selenium-Execution-Report
        path: Maven_selenium_new_project/target/ExtentReport.html

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Maven_selenium_new_project/target
